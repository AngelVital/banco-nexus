version: '3.8'

services:
  # 1. Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: bank_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - bank-net
    # Deploy setup for Swarm (db is usually single-replica or external managed in AWS)
    deploy:
      placement:
        constraints:
          - node.role == manager

  # 2. Capa de Backend Monolítico (Replicado para Alta Disponibilidad)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: banconexus-backend:latest
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/bank_db
      JWT_SECRET: super_secret_bank_key_12345
      PORT: 5000
    depends_on:
      - db
    ports:
      - "5000:5000"
    networks:
      - bank-net
    # Swarm orchestrations specifications for Rolling Updates & High Availability
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # 3. Capa de Frontend (SPA Nginx reverse-proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: banconexus-frontend:latest
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - bank-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  bank-net:
    driver: overlay
    attachable: true

volumes:
  pgdata:
    driver: local
